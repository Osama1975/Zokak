<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تم الإرسال بنجاح</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(to bottom right, #6a3ab2, #9b68e4);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      max-width: 400px;
    }

    .card h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .card p {
      font-size: 16px;
      margin-bottom: 25px;
      color: #f0eaff;
    }

    .btn {
      display: inline-block;
      background: white;
      color: #6a3ab2;
      padding: 10px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #f0eaff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>✅ تم إرسال رسالتك بنجاح</h1>
    <p>شكرًا لتواصلك معنا! سنقوم بالرد عليك في أقرب وقت ممكن.</p>
    <a href="index.html" class="btn">العودة إلى الصفحة الرئيسية</a>
  </div>

</body>
</html>
